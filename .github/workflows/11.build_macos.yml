name: Build macOS Apple Silicon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: 0
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.0"
          python-version: "3.14.8"
          enable-cache: true
          cache-python: true
          prune-cache: false

      - name: Install dependencies
        run: |
          uv sync --group build
          uv run python build.py --task ocr

      - name: Create macOS icon
        run: |
          mkdir -p assets/logo/March7th.iconset
          uv run python -c "from PIL import Image; from pathlib import Path; im=Image.open('assets/logo/March7th.ico').convert('RGBA'); p=Path('assets/logo/March7th.iconset'); [(im.resize((s,s), Image.Resampling.LANCZOS).save(p/f'icon_{s}x{s}.png'), im.resize((s*2,s*2), Image.Resampling.LANCZOS).save(p/f'icon_{s}x{s}@2x.png')) for s in (16,32,128,256,512)]"
          iconutil -c icns assets/logo/March7th.iconset -o assets/logo/March7th.icns

      - name: Build application and CLI
        run: uv run pyinstaller --distpath ./dist "./March7th macOS.spec" -y

      - name: Assemble application bundle
        run: |
          APP="dist/March7th Assistant.app"
          MACOS="$APP/Contents/MacOS"
          cp "dist/March7th Assistant CLI/March7th Assistant" "$MACOS/March7th Assistant"
          cp -R "dist/March7th Assistant CLI/libraries" "$MACOS/libraries"
          cp -R assets "$MACOS/assets"
          mkdir -p "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          cp README.md "$APP/Contents/Resources/README.md"
          cp assets/agent/AGENTS.md "$APP/Contents/Resources/AGENTS.md"
          # Contents/MacOS 只保留可执行文件与必要的资源链接，避免 codesign 误判。
          mv "$MACOS/libraries" "$APP/Contents/Frameworks/libraries"
          ln -s ../Frameworks/libraries "$MACOS/libraries"
          mv "$MACOS/assets" "$APP/Contents/Resources/assets"
          ln -s ../Resources/assets "$MACOS/assets"
          chmod +x "$MACOS/March7th Launcher" "$MACOS/March7th Assistant"

      - name: Verify executable architecture and CLI
        run: |
          APP="dist/March7th Assistant.app"
          MACOS="$APP/Contents/MacOS"
          file "$MACOS/March7th Launcher" "$MACOS/March7th Assistant"
          lipo -archs "$MACOS/March7th Launcher"
          lipo -archs "$MACOS/March7th Assistant"
          "$MACOS/March7th Assistant" --version
          "$MACOS/March7th Assistant" --list --json
          test -f "$MACOS/assets/config/config.example.yaml"

      - name: Ad-hoc sign and archive
        run: |
          # 冒烟测试会生成日志和配置；签名前清掉，MacOS 目录仅保留程序与资源链接。
          APP="dist/March7th Assistant.app"
          MACOS="$APP/Contents/MacOS"
          find "$MACOS" -mindepth 1 -maxdepth 1 \
            ! -name 'March7th Launcher' ! -name 'March7th Assistant' \
            ! -name 'libraries' ! -name 'assets' -exec rm -rf {} +
          codesign --force --sign - "dist/March7th Assistant.app"
          codesign --display --verbose=2 "dist/March7th Assistant.app"
          ditto -c -k --keepParent "dist/March7th Assistant.app" "dist/March7thAssistant-macOS-arm64.zip"
          shasum -a 256 "dist/March7thAssistant-macOS-arm64.zip"

      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: March7thAssistant-macOS-arm64
          path: dist/March7thAssistant-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
